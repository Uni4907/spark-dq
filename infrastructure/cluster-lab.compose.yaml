name: ${LAB_PROJECT:?}
x-owned: &owned
  sparkdq.lab: ${LAB_PROJECT:?}
x-worker: &worker
  image: ${LAB_WORKER_IMAGE:?}
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  mem_limit: 2g
  cpus: 1
  tmpfs: ["/tmp:rw,exec,size=768m"]
  labels: *owned
  entrypoint: [/usr/bin/timeout, --signal=TERM, --kill-after=10s, 10800s, /opt/spark/bin/spark-class]
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    labels: *owned
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: sparkdq
      MYSQL_USER: sparkdq
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u sparkdq -D sparkdq -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 50
  master:
    <<: *worker
    hostname: master
    mem_limit: 512m
    cpus: 0.5
    environment: {SPARK_DAEMON_MEMORY: 256m, SPARK_LOG_DIR: /tmp/logs}
    command: [org.apache.spark.deploy.master.Master, --host, master, --port, "7077", --webui-port, "8080"]
  worker1:
    <<: *worker
    hostname: worker1
    environment: {SPARK_DAEMON_MEMORY: 256m, SPARK_PUBLIC_DNS: worker1, SPARK_WORKER_DIR: /work, SPARK_LOG_DIR: /tmp/logs, SPARK_LOCAL_DIRS: /tmp/spark}
    volumes: [files:/data, worker1-work:/work]
    command: [org.apache.spark.deploy.worker.Worker, --host, worker1, --cores, "1", --memory, 1024m, --webui-port, "8081", "spark://master:7077"]
    depends_on: [master]
  worker2:
    <<: *worker
    hostname: worker2
    environment: {SPARK_DAEMON_MEMORY: 256m, SPARK_PUBLIC_DNS: worker2, SPARK_WORKER_DIR: /work, SPARK_LOG_DIR: /tmp/logs, SPARK_LOCAL_DIRS: /tmp/spark}
    volumes: [files:/data, worker2-work:/work]
    command: [org.apache.spark.deploy.worker.Worker, --host, worker2, --cores, "1", --memory, 1024m, --webui-port, "8081", "spark://master:7077"]
    depends_on: [master]
  backend:
    image: ${LAB_BACKEND_IMAGE:?}
    labels: *owned
    mem_limit: 2g
    pids_limit: 1024
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DQ_EXECUTION: standalone
      SPARK_MASTER: spark://master:7077
      SPARK_DQ_DRIVER_HOST: driver
      SPARK_DQ_MASTER_JSON_URL: http://master:8080/json/
      SPARK_DQ_WORKER_JSON_URLS: http://worker1:8081/json/,http://worker2:8081/json/
      SPARK_INPUT_PARTITIONS: 8
      SPARK_SHUFFLE_PARTITIONS: 2
    networks: {default: {aliases: [driver]}, edge: {}}
    ports: ["127.0.0.1::8080"]
    volumes: [files:/data]
    depends_on:
      mysql: {condition: service_healthy}
      worker1: {condition: service_started}
      worker2: {condition: service_started}
  frontend:
    image: ${LAB_FRONTEND_IMAGE:?}
    labels: *owned
    mem_limit: 512m
    networks: [edge]
    ports: ["127.0.0.1::5173"]
    depends_on: [backend]
networks:
  default: {internal: true, labels: *owned}
  edge: {labels: *owned}
volumes:
  mysql-data: {labels: *owned}
  files: {labels: *owned}
  worker1-work: {labels: *owned}
  worker2-work: {labels: *owned}
