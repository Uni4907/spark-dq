name: __PROJECT__
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: sparkdq
      MYSQL_USER: sparkdq
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u sparkdq -D sparkdq -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 50
  backend:
    image: spark-dq-backend:migrations-v2
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPARK_LOCAL_IP: 127.0.0.1
    ports: ["127.0.0.1::8080"]
    volumes: ["files:/data"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
  files:
