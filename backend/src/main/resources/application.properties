server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/sparkdq?connectionTimeZone=UTC&characterEncoding=UTF-8
spring.datasource.username=sparkdq
spring.datasource.password=${MYSQL_PASSWORD}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# Reject unknown future migrations rather than silently running older application code.
spring.flyway.ignore-migration-patterns=
spring.flyway.validate-migration-naming=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never

# Preserve exact JSON numeric rule boundaries before canonical decimal normalization.
spring.jackson.deserialization.use-big-decimal-for-floats=true
